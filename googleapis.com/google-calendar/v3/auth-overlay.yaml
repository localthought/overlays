overlay: 1.0.0
info:
  title: google-calendar OAuth authorization requirements
  version: 1.2.0
actions:
- target: $.components.securitySchemes
  update:
    googleOnline:
      type: oauth2
      x-oauth-authentication-details:
        authorizationServerMetadata:
          token_endpoint_auth_methods_supported:
          - client_secret_post
          - client_secret_basic
          code_challenge_methods_supported:
          - S256
        authorizationCode:
          pkce:
            requirement: optional
          profile:
            parameters:
            - parameter:
                name: access_type
                in: query
                schema:
                  type: string
                  enum:
                  - online
                  - offline
              value: online
            tokenIssuance:
              refreshToken:
                presence: never
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/calendar.events: View and edit events
              on calendars.
            https://www.googleapis.com/auth/calendar.calendarlist.readonly: View the
              calendars to which the user is subscribed.
    googleOffline:
      type: oauth2
      x-oauth-authentication-details:
        authorizationServerMetadata:
          token_endpoint_auth_methods_supported:
          - client_secret_post
          - client_secret_basic
          code_challenge_methods_supported:
          - S256
        authorizationCode:
          pkce:
            requirement: optional
          profile:
            parameters:
            - parameter:
                name: access_type
                in: query
                schema:
                  type: string
                  enum:
                  - online
                  - offline
              value: offline
            capabilities:
            - offlineAccess
            tokenIssuance:
              refreshToken:
                presence: conditional
                conditions:
                - firstAuthorization
                description: Google can omit a refresh token after the first authorization.
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/calendar.events: View and edit events
              on calendars.
            https://www.googleapis.com/auth/calendar.calendarlist.readonly: View the
              calendars to which the user is subscribed.
- target: $.paths['/calendars/{calendarId}/events'].get
  update:
    security:
    - googleOnline:
      - https://www.googleapis.com/auth/calendar.events
    - googleOffline:
      - https://www.googleapis.com/auth/calendar.events
- target: $.paths['/calendars/{calendarId}/events/{eventId}'].get
  update:
    security:
    - googleOnline:
      - https://www.googleapis.com/auth/calendar.events
    - googleOffline:
      - https://www.googleapis.com/auth/calendar.events
- target: $.paths['/users/me/calendarList'].get
  update:
    security:
    - googleOnline:
      - https://www.googleapis.com/auth/calendar.calendarlist.readonly
    - googleOffline:
      - https://www.googleapis.com/auth/calendar.calendarlist.readonly
- target: $.paths['/users/me/calendarList/{calendarId}'].get
  update:
    security:
    - googleOnline:
      - https://www.googleapis.com/auth/calendar.calendarlist.readonly
    - googleOffline:
      - https://www.googleapis.com/auth/calendar.calendarlist.readonly

# The base document (now the full, generated googleapis.com/calendar/v3
# document — see catalog.json) already declares this `patch` operation in
# full: operationId, parameters, and a requestBody/200 response both typed
# as `#/components/schemas/Event`. It only needs narrowing to the one scope
# this platform actually requests (its own `security` lists every scope
# alternative Google's Discovery doc allows) and a `412` response, which
# Discovery's format has no room to express, documenting the optimistic-
# concurrency conflict Devonian's lens (`applyCalendarEdit` in
# localthought/devonian) handles via `If-Match`/ETag. Reuses the
# `calendar.events` scope already requested for the events GET operations
# above, so no new consent/reconnect is required.
- target: $.paths['/calendars/{calendarId}/events/{eventId}'].patch
  update:
    security:
    - googleOnline:
      - https://www.googleapis.com/auth/calendar.events
    - googleOffline:
      - https://www.googleapis.com/auth/calendar.events
    responses:
      '412':
        description: >
          The If-Match precondition failed: the event changed remotely
          since it was last read.
