overlay: 1.0.0
info:
  title: google-calendar OAuth authorization requirements
  version: 1.1.0
actions:
- target: $.components.securitySchemes
  update:
    googleOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            https://www.googleapis.com/auth/calendar.events: View and edit events
              on calendars.
            https://www.googleapis.com/auth/calendar.calendarlist.readonly: View the
              calendars to which the user is subscribed.
- target: $.paths['/calendars/{calendarId}/events'].get
  update:
    security:
    - googleOAuth:
      - https://www.googleapis.com/auth/calendar.events
- target: $.paths['/calendars/{calendarId}/events/{eventId}'].get
  update:
    security:
    - googleOAuth:
      - https://www.googleapis.com/auth/calendar.events
- target: $.paths['/users/me/calendarList'].get
  update:
    security:
    - googleOAuth:
      - https://www.googleapis.com/auth/calendar.calendarlist.readonly
- target: $.paths['/users/me/calendarList/{calendarId}'].get
  update:
    security:
    - googleOAuth:
      - https://www.googleapis.com/auth/calendar.calendarlist.readonly
