overlay: 1.0.0
info:
  title: moneybird OAuth authorization requirements
  version: 1.1.0
actions:
- target: $.components.securitySchemes
  update:
    moneybirdOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://moneybird.com/oauth/authorize
          tokenUrl: https://moneybird.com/oauth/token
          scopes:
            sales_invoices: Access sales invoices and contacts.
- target: $.paths['/administrations.json'].get
  update:
    security:
    - moneybirdOAuth:
      - sales_invoices
    - &id001
      bearerAuth: []
- target: $.paths['/{administration_id}/contacts.json'].get
  update:
    security:
    - moneybirdOAuth:
      - sales_invoices
    - *id001
- target: $.paths['/{administration_id}/contacts/{id}.json'].get
  update:
    security:
    - moneybirdOAuth:
      - sales_invoices
    - *id001
