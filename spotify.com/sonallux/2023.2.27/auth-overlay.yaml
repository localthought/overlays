overlay: 1.0.0
info:
  title: Spotify Web API Authentication Profile
  version: 1.0.0
# The proxy obtains an OAuth 2.0 access token and forwards it as a bearer
# credential.  The initial catalog slice only reads the authenticated user's
# playlists and playlist visibility, so these are the minimum useful scopes.
actions:
  - target: $.components.securitySchemes
    update:
      spotifyToken:
        type: http
        scheme: bearer
        description: >
          Spotify OAuth 2.0 access token, sent as a bearer token. The initial
          read-only playlist integration requests playlist-read-private and
          playlist-read-collaborative.
