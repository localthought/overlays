overlay: 1.0.0
info:
  title: Square API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        cursor:
          type: pageToken
          description: >-
            Square v2 endpoints use cursor-based pagination. The `cursor`
            parameter specifies the position in the result set for the next
            request. When a response includes a `cursor` field, it means
            more results are available.
          request:
            queryParameters:
              cursor:
                role: pageToken
              limit:
                role: pageSize
          response:
            bodyFields:
              cursor:
                role: nextPageToken
