overlay: 1.0.0
info:
  title: Jira Cloud REST API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        startAt:
          type: pageNumber
          description: >-
            Most Jira list endpoints use index-based pagination. `startAt` is
            the zero-based index of the first item to return, and `maxResults`
            controls the page size. The response includes `total` for the total
            item count and `isLast` to signal the final page.
          request:
            queryParameters:
              startAt:
                role: offset
              maxResults:
                role: pageSize
          response:
            bodyFields:
              total:
                role: totalCount
        offset:
          type: pageNumber
          description: >-
            Some Jira endpoints (e.g. audit records) use `offset` and `limit`
            instead of `startAt`/`maxResults`.
          request:
            queryParameters:
              offset:
                role: offset
              limit:
                role: pageSize
          response:
            bodyFields:
              total:
                role: totalCount
