overlay: 1.0.0
info:
  title: Trello API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        pageNumber:
          type: pageNumber
          description: >-
            Trello list endpoints support page-number pagination with `page`
            (page index, 0-based) and `limit` (max items per page, up to
            1000). Note: page * limit must be less than 1000.
          request:
            queryParameters:
              page:
                role: page
              limit:
                role: pageSize
