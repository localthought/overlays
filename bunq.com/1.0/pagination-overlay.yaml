overlay: 1.0.0
info:
  title: bunq API Pagination Schemes
  version: 1.0.0
actions:
  - target: $.components
    update:
      paginationSchemes:
        cursor:
          type: pageToken
          description: >-
            bunq uses ID-based cursor pagination. Pass the ID of the oldest
            item in the current page as `older_id` to retrieve older items,
            or `newer_id` for newer items. The response `Pagination` object
            contains `older_url` and `newer_url` for navigation. `count`
            controls the page size (default 10, max 200).
          request:
            queryParameters:
              older_id:
                role: pageToken
              count:
                role: pageSize
